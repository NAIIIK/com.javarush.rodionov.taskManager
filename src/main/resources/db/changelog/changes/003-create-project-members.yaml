databaseChangeLog:
  - changeSet:
      id: 003-create-project-members
      author: nikita
      changes:
        - createTable:
            tableName: project_members
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_project_members_project
                    references: projects(id)
                    deleteCascade: true
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_project_members_user
                    references: users(id)
              - column:
                  name: role
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: timestamp
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: project_members
            columnNames: project_id, user_id
            constraintName: uq_project_members_project_user